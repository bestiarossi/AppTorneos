<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#059669" />
    <meta name="application-name" content="AppTorneos" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AppTorneos" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=2" />
    <link id="dynamic-apple-icon" rel="apple-touch-icon" sizes="180x180" href="/icons/icon.svg?v=2" />
    <title>AppTorneos — Torneos entre Amigos</title>
    <script>
      // Genera automáticamente el PNG 180x180 desde el nuevo icon.svg para iOS/Android
      (function () {
        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function () {
          try {
            var canvas = document.createElement('canvas');
            canvas.width = 180;
            canvas.height = 180;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 180, 180);
            var appleLink = document.getElementById('dynamic-apple-icon');
            if (appleLink) appleLink.href = canvas.toDataURL('image/png');
          } catch (e) {}
        };
        img.src = '/icons/icon.svg?v=2';
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
