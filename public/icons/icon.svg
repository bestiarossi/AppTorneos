    stroke-width="30"
    stroke-linecap="round"
  />

  <!-- Estrella superior de campeón Ocre Dorado -->
  <path
    d="M256 90L270 119L302 123L278 144L284 175L256 159L228 175L234 144L210 123L242 119L256 90Z"
