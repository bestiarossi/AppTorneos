<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgOrange" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D46F4D" />
      <stop offset="55%" stop-color="#C8603E" />
      <stop offset="100%" stop-color="#A94B2D" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="120" y1="60" x2="392" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBF5E8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FBF5E8" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Fondo Naranja Terracota con borde Crema y filete Ocre -->
  <rect width="512" height="512" rx="116" fill="url(#bgOrange)" />
  <rect x="14" y="14" width="484" height="484" rx="102" stroke="#FBF5E8" stroke-width="14" />

  <!-- Escudo exterior de campeonato -->
  <path
    d="M256 56L418 118V250C418 352 348 430 256 460C164 430 94 352 94 250V118L256 56Z"
