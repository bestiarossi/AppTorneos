    stroke="#FBF5E8"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Llaves laterales de torneo (Brackets) -->
  <path
    d="M140 184H176V270H140M372 184H336V270H372"
    stroke="#FBF5E8"
    stroke-opacity="0.82"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Copa central -->
  <path
    d="M188 152H324V218C324 256 294 286 256 286C218 286 188 256 188 218V152Z"
